  const clear=G.result==='clear';
  if(!G.registered){
    show(a,'form'+clear,`<div class="end"><div data-timer>${tHTML(shown())}</div><h1>${clear?'탈출 완료':'시간 종료'}</h1><p style="font-size:20px"><b>기기는 그대로 두고 퇴장해 주세요.</b><br>리더보드에 등록하려면 대표자의 이름과 학번, 인원을 입력하십시오.<br>입력 시, 부스 앞 화면에 표시됩니다.</p>
    <input id="fn" placeholder="여기에 대표자 이름을 입력하세요."><input id="fs" inputmode="numeric" placeholder="여기에 학번을 입력하세요."><input id="fc" type="number" min="1" inputmode="numeric" placeholder="본인을 포함하여 몇명인지 입력하세요."><div id="er" class="mini"></div><button id="fok">완료</button></div>`,()=>{
      $('#fok').onclick=async()=>{const n=$('#fn').value.trim(),s=$('#fs').value.trim(),c=parseInt($('#fc').value);
        if(!n||!s||!(c>=1)){$('#er').textContent='이름, 학번, 인원을 모두 입력해 주세요.';return}
        $('#fok').disabled=true;await db.collection('records').add({name:n,sid:s,count:c,clear,clearMs:clear?G.totalMs-(G.remainMs||0):G.totalMs,ts:now()});await set({registered:true})}});
  }else show(a,'done'+clear,`<div class="end"><h1>등록되었습니다</h1><p style="font-size:24px"><b>기기는 그대로 두고 퇴장해 주세요.</b></p></div>`);
}
/* ---------- 리더보드 ---------- */
function board(a){
  document.body.className='light';
  if(!$('#bh')){a.dataset.k='';a.innerHTML='<div class="bd"><div class="bt" id="bh"></div><div class="grid" id="bg"></div><button class="xl" id="xl">엑셀 내려받기</button></div>';$('#xl').onclick=exportCSV;bHead='';bRows=''}
  const p=phase(),bh=$('#bh');
  if(p!==bHead){bHead=p;
    bh.innerHTML=p==='prep'?'<span data-timer></span><span class="aft"> 후 시작해요.</span>':(p==='running'||p==='paused')?`<span data-timer></span><span class="aft"> ${p==='paused'?'일시정지':'남았어요.'}</span>`:`<span class="aft">${p==='finished'?'게임 종료':'다음 팀을 기다리고 있어요'}</span>`;
    bh.classList.remove('ent');void bh.offsetWidth;bh.classList.add('ent')}
  const N=Math.min(30,Math.max(2,S.bn||10)),top=R.slice(0,N),sig=N+'|'+top.map(r=>r.id+r.name+r.count+r.clearMs+r.clear).join();
  if(sig!==bRows){bRows=sig;const g=$('#bg'),old={};g.style.setProperty('--n',Math.ceil(N/2));
    g.querySelectorAll('.rk[data-id]').forEach(e=>{old[e.dataset.id]=e.getBoundingClientRect()});
    let rows='';for(let i=0;i<N;i++){const r=top[i];rows+=r?`<div class="rk" data-id="${r.id}"><b>${i+1}등</b><i>${esc(r.name)}${r.count>1?' 외 '+(r.count-1)+'명':''}</i><em>${r.clear?mmss(r.clearMs):'시간 초과'}</em></div>`:`<div class="rk"><b>${i+1}등</b><i style="color:#aaa">—</i></div>`}
    g.innerHTML=rows;
    g.querySelectorAll('.rk[data-id]').forEach((e,i)=>{const o=old[e.dataset.id],r=e.getBoundingClientRect(),ez='cubic-bezier(.2,.8,.2,1)';
      if(o){const dx=o.left-r.left,dy=o.top-r.top;if(dx||dy)e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:650,easing:ez})}
      else e.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:650,easing:ez,delay:i*60,fill:'backwards'})})}
}
/* ---------- 관리도구 ---------- */
function arm(btn,fn){let t;btn.onclick=()=>{if(btn.dataset.arm){clearTimeout(t);btn.textContent=btn.dataset.o;delete btn.dataset.arm;fn()}else{btn.dataset.o=btn.textContent;btn.dataset.arm=1;btn.textContent='한 번 더 누르면 실행';t=setTimeout(()=>{btn.textContent=btn.dataset.o;delete btn.dataset.arm},3000)}}}
function say(t){if(t.trim())db.doc('announce').set({text:t.trim(),n:now()})}
function fillAdmin(){if(!built||filled||!sLoaded)return;filled=true;$('#bn').value=S.bn;$('#mn').value=S.mn;$('#sc').value=S.sc;$('#pp').value=S.pp;$('#m1').value=S.m1;$('#m2').value=S.m2}
function saveS(){S={mn:Math.min(99,Math.max(0,+$('#mn').value||0)),sc:Math.min(59,Math.max(0,+$('#sc').value||0)),pp:Math.max(0,+$('#pp').value||0),bn:Math.min(30,Math.max(2,+$('#bn').value||10)),m1:$('#m1').value,m2:$('#m2').value};db.doc('settings').set(S)}
function admin(a){
  if(!built){built=true;edBuilt=false;filled=false;a.dataset.k='admin';
    a.innerHTML=`<div class="wrap"><button id="hm" style="float:right">역할 선택으로</button><h1>관리도구</h1><div class="panel"><div>상태: <span class="badge" id="st"></span></div><div class="mid" data-timer style="margin:10px 0"></div><div id="hu" class="lbl"></div>
    <div class="row"><button id="bs">시작</button><button id="bp">일시정지</button><button id="bc">탈출 완료 처리</button><button id="br">초기화</button></div></div>
    <div class="panel"><h3>시간 설정 (시작 버튼을 누를 때 적용)</h3>
    <div class="row">제한 시간 <input id="mn" type="number" min="0" max="99" style="width:80px"> 분 <input id="sc" type="number" min="0" max="59" style="width:80px"> 초 &nbsp; 준비 시간 <input id="pp" type="number" min="0" style="width:90px"> 초</div><div class="row">리더보드 표시 순위 <input id="bn" type="number" min="2" max="30" style="width:90px"> 위까지 (최대 30)</div>
    <p class="lbl" style="margin:14px 0 4px">준비 시간이 10초 남았을 때 읽을 멘트</p><div class="row"><input id="m1" style="flex:1;min-width:220px"><button id="t1">미리듣기</button></div>
    <p class="lbl" style="margin:14px 0 4px">준비 시간이 끝나 게임이 시작될 때 읽을 멘트</p><div class="row"><input id="m2" style="flex:1;min-width:220px"><button id="t2">미리듣기</button></div>
    <p class="lbl">멘트는 타이머 기기에서 기본 음성(TTS)으로 재생돼요. 타이머 기기를 한 번 터치해 두어야 소리가 납니다.</p></div>
    <div class="panel"><h3>음성 안내 (바로 재생)</h3><div id="pr" class="row"></div><div class="row"><input id="vt" placeholder="직접 입력한 문장 읽어주기" style="flex:1;min-width:220px"><button id="vb">읽기</button></div></div>
    <div class="panel"><h3>힌트 설정 (게임 중에는 바꾸지 마세요)</h3><div id="ed">불러오는 중…</div></div>
    <div class="panel"><h3>리더보드 기록</h3><div class="row"><button id="xx">엑셀로 내려받기</button><button id="xd">기록 전체 삭제</button></div><div id="rl"></div></div></div>`;
    ['mn','sc','pp','bn','m1','m2'].forEach(i=>$('#'+i).onchange=saveS);
    $('#t1').onclick=()=>speak($('#m1').value);$('#t2').onclick=()=>speak($('#m2').value);
    $('#bs').onclick=()=>{saveS();const tot=Math.max(10000,S.mn*60000+S.sc*1000),t=now();ended=false;spoke={};
      set({status:'running',totalMs:tot,startAt:t+S.pp*1000,endsAt:t+S.pp*1000+tot,remainMs:tot,hintIdx:-1,result:null,registered:false,msgPre:S.m1,msgStart:S.m2})};
    $('#bp').onclick=()=>{if(G.status==='running'&&phase()==='running')set({status:'paused',remainMs:left()});else if(G.status==='paused')set({status:'running',endsAt:now()+G.remainMs})};
    arm($('#bc'),()=>{if(phase()!=='running'&&G.status!=='paused')return;set({status:'finished',remainMs:left(),result:'clear',registered:false})});
    arm($('#br'),()=>set({status:'idle',hintIdx:-1,remainMs:0,result:null,registered:false}));
    PRESETS.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>say(t);$('#pr').append(b)});
    $('#vb').onclick=()=>say($('#vt').value);
    $('#hm').onclick=()=>goRole(null);$('#xx').onclick=exportCSV;arm($('#xd'),()=>db.doc('records').delete());
    if(hsLoaded)buildEd();fillAdmin();
  }
  const s=G.status,p=phase();
  $('#st').textContent=STAT[p];
  $('#bs').disabled=s==='running'||s==='paused';
  $('#bp').disabled=!(p==='running'||s==='paused');$('#bp').textContent=s==='paused'?'재개':'일시정지';
  $('#bc').disabled=!(p==='running'||s==='paused');
  $('#hu').textContent=(G.hintIdx>=0?`힌트 ${G.hintIdx+1}번 사용됨`:'힌트 아직 사용 안 함')+(s==='finished'?(G.result==='clear'?' · 탈출 완료':' · 시간 종료')+(G.registered?' · 기록 등록됨':' · 기록 입력 대기 중'):'');
  const rl=$('#rl');rl.innerHTML='';if(!R.length)rl.textContent='기록 없음';
  R.forEach((r,i)=>{const d=document.createElement('div');d.className='row';const sp=document.createElement('span');sp.style.flex='1';sp.textContent=`${i+1}. ${r.name} (${r.sid}) ${r.count}명 — ${r.clear?mmss(r.clearMs):'시간 초과'}`;const b=document.createElement('button');b.textContent='삭제';arm(b,()=>db.doc('records/'+r.id).delete());d.append(sp,b);rl.append(d)});
}
function buildEd(){
  edBuilt=true;
  ED=Array.from({length:hn()},(_,i)=>({title:H[i]?.title||'',text:H[i]?.text||'',img:H[i]?.img||''}));
  drawEd();
}
function drawEd(){
  const ed=$('#ed');if(!ed)return;ed.innerHTML='';
  const dirty=()=>{const m=$('#hmsg');if(m)m.textContent='저장하지 않은 변경이 있어요'};
  ED.forEach((x,i)=>{
    const d=document.createElement('div');d.className='hed';
    d.innerHTML='<div class="row"><b style="flex:1">힌트 '+(i+1)+'</b><button class="x">삭제</button></div><input class="a" placeholder="힌트 제목"><textarea class="b" rows="3" placeholder="힌트 내용"></textarea><input class="c" type="file" accept="image/*"><img class="p" alt=""><div class="row"><button class="r">이미지 제거</button></div>';
    const A=d.querySelector('.a'),B=d.querySelector('.b'),P=d.querySelector('.p');
    A.value=x.title;B.value=x.text;P.hidden=!x.img;if(x.img)P.src=x.img;
    A.oninput=()=>{x.title=A.value;dirty()};B.oninput=()=>{x.text=B.value;dirty()};
    d.querySelector('.c').onchange=e=>{const f=e.target.files[0];if(f)shrink(f,u=>{x.img=u;P.src=u;P.hidden=false;dirty()})};
    d.querySelector('.r').onclick=()=>{x.img='';P.hidden=true;dirty()};
    arm(d.querySelector('.x'),()=>{ED.splice(i,1);drawEd();dirty()});
    ed.append(d)});
  const r=document.createElement('div');r.className='row';r.innerHTML='<button id="ha">+ 힌트 추가</button><button id="hsv">힌트 저장</button><span class="lbl" id="hmsg"></span>';ed.append(r);
  $('#ha').onclick=()=>{if(ED.length>=10){$('#hmsg').textContent='힌트는 최대 10개까지예요';return}ED.push({title:'',text:'',img:''});drawEd();dirty()};
  $('#hsv').onclick=async()=>{try{await db.doc('hintset').set({n:ED.length,items:ED});$('#hmsg').textContent='저장됨 ✓'}catch(e){$('#hmsg').textContent='저장 실패'}};
}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};im.src=r.result};r.readAsDataURL(f)}
const hn=()=>hsEx?H.length:4;
function actx(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function beep(t,dur,f,vol){const c=actx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.setValueAtTime(vol,t+dur-.01);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}
function tickBeep(hi){const c=actx();if(c)beep(c.currentTime+.01,.08,hi?1500:1000,.3)}
function alarm(){const c=actx();if(!c)return;const t0=c.currentTime+.05;for(let g=0;g<5;g++)for(let k=0;k<4;k++)beep(t0+g+k*.14,.09,k===3?2000:1600,.4)}
function tv(a){
  document.body.className='dark';
  const p=phase(),fin=p==='finished'&&!tvHold,k='tv|'+p+'|'+fin+'|'+primed+'|'+G.result;
  const h=fin?`<div class="full"><div class="c" style="text-align:center;padding:0 5vw"><div class="tvt">${G.result==='clear'?'탈출 성공':'시간 종료'}</div><div class="tvm">태블릿 화면에서 리더보드를 입력하고<br>안내에 따라 퇴장해주세요.</div></div></div>`
   :`<div class="full"><div class="c"><div class="lbl" style="font-size:clamp(20px,3vw,40px)">${p==='prep'?'게임 시작까지':'남은 시간'}</div><div class="huge" data-timer>${tHTML(shown())}</div>${primed?'':'<div class="mini">화면을 한 번 클릭하면 소리가 켜집니다</div>'}</div></div>`;
  show(a,k,h);
}
const ROLES=['player','admin','board','tv'];
const hashRole=()=>{const h=location.hash.slice(1);return ROLES.includes(h)?h:null};
function goRole(r){role=r||null;const a=$('#app');clearTimeout(swapT);a.classList.remove('out');a.dataset.k='';a.innerHTML='';built=false;bHead='';bRows='';view='main';
  if(r){if(location.hash.slice(1)!==r)location.hash=r}else history.replaceState(null,'',location.pathname+location.search);render()}
function exportCSV(){
  const q=v=>{v=String(v??'');if(/^\d+$/.test(v))return '="'+v+'"';if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'},t=x=>'"'+x+'"';
  const L=[['순위','대표자 이름','학번','인원','결과','기록','기록(초)','등록 시각'].map(t).join(',')];
  R.forEach((r,i)=>L.push([i+1,q(r.name),q(r.sid),r.count,t(r.clear?'탈출':'시간 초과'),t(r.clear?mmss(r.clearMs):'-'),r.clear?Math.round(r.clearMs/1000):'',t(new Date(r.ts).toLocaleString('ko-KR'))].join(',')));
  const d=new Date(),p=n=>String(n).padStart(2,'0'),name='리더보드_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'.csv';
  const u=URL.createObjectURL(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  const l=document.createElement('a');l.href=u;l.download=name;document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
init();
</script></body></html>
