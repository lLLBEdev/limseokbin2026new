<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방탈출</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
body{transition:background-color .6s ease,color .6s ease}
body.dark{background:#000;color:#fff}body.light{background:#fff;color:#000}
#app{transition:opacity .16s ease,transform .16s ease}
#app.out{opacity:0;transform:scale(.985)}
#app>*{animation:enter .45s cubic-bezier(.2,.8,.2,1) both}
.ent{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dIn{from{opacity:0;transform:translateY(-.16em)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.55}}
@keyframes flipIn{from{opacity:0;transform:perspective(900px) rotateY(-80deg)}to{opacity:1;transform:none}}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
.lbl{color:#aaa;font-size:16px}.light .lbl{color:#444}
[data-timer]{font-variant-numeric:tabular-nums;transition:color .6s ease}
[data-timer].warn{color:#ff9494}.light [data-timer].warn{color:#d3202f}
[data-timer].pulse{animation:pulse 1s ease-in-out infinite}
.d{display:inline-block;font-style:normal}.d.chg{animation:dIn .28s ease-out}
.big{font-size:clamp(56px,12vw,120px);font-weight:200;line-height:1}
.u{font-size:clamp(18px,3vw,34px);margin:0 10px 0 4px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.note{font-size:clamp(15px,2vw,22px);max-width:560px}
.panel{background:#262626;border-radius:32px;padding:22px;margin-top:16px}
.full{min-height:100vh;display:flex;flex-direction:column;padding:16px}
.full .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.huge{font-size:clamp(90px,26vw,320px);line-height:1}.huge .big{font-size:inherit}.huge .u{font-size:.17em}
.bar{background:#262626;border-radius:24px;padding:26px;text-align:center;font-size:clamp(18px,3vw,30px);cursor:pointer;transition:transform .2s ease,background .3s ease}
.bar:active{transform:scale(.98)}.bar.w{background:#fff;color:#000;margin-top:16px;padding:18px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.card{position:relative;aspect-ratio:338/552;border-radius:14px;background:#1a0a0e url(card.jpg) center/cover;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .4s ease,box-shadow .3s ease;animation:enter .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.card span{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#fff;color:#000;border-radius:10px;padding:8px 18px;white-space:nowrap}
@media(hover:hover){.card:not(.lock):hover{transform:translateY(-8px);box-shadow:0 14px 30px #a3122a66}}
.card:not(.lock):active{transform:scale(.96)}
.card.lock{opacity:.3;cursor:default}.card.done{box-shadow:0 0 0 3px #ff9494}
button{font:inherit;background:#fff;color:#000;border:0;border-radius:22px;padding:11px 20px;cursor:pointer;transition:transform .2s ease,opacity .3s ease,background .3s ease}
button:active{transform:scale(.96)}button:disabled{opacity:.4;cursor:default}button.pink{background:#ff9494}
.conf{display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:center}
.conf .card{width:200px;cursor:default;animation:flipIn .7s cubic-bezier(.2,.8,.2,1) both}
.conf .t{flex:1;min-width:240px;font-size:22px}.conf .b{display:flex;flex-direction:column;gap:12px;min-width:240px}
.hv{animation:flipIn .7s cubic-bezier(.2,.8,.2,1) both}.hv img{max-width:100%;max-height:320px;border-radius:12px}.hv p{font-size:22px;white-space:pre-wrap}
input,textarea{font:inherit;background:#111;color:#fff;border:1px solid #555;border-radius:12px;padding:10px;width:100%;transition:border-color .25s ease,box-shadow .25s ease}
.light input{background:#fff;color:#000;border:1.5px solid #000;border-radius:40px;padding:20px;text-align:center;font-size:22px}
input:focus,textarea:focus{outline:0;border-color:#ff9494;box-shadow:0 0 0 4px #ff949433}
.end{max-width:620px;margin:0 auto;text-align:center;padding-top:24px}
.end h1{margin:6px 0 14px;font-size:38px}.end input{margin:8px 0}.end button{background:#000;color:#fff;padding:18px 50px;font-size:22px;margin-top:10px}
.bt{font-size:clamp(30px,5vw,60px);font-weight:800;margin:16px 0 26px;min-height:1.3em}.bt .big{font-weight:800;font-size:clamp(70px,15vw,190px)}.bt .u{font-weight:800}.bt .aft{font-size:clamp(30px,6vw,80px)}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(3,1fr);gap:16px 28px}
.rk{background:#f0f0f0;border-radius:40px;padding:clamp(18px,3.4vw,40px) clamp(18px,3vw,36px);display:flex;gap:clamp(12px,3vw,40px);align-items:center;font-size:clamp(20px,3.2vw,40px)}
.rk b{min-width:2.2em}.rk i{flex:1;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk em{font-style:normal;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.hed{border-top:1px solid #444;padding:12px 0;display:flex;flex-direction:column;gap:8px}.hed img{max-width:160px;border-radius:8px}
.badge{display:inline-block;padding:4px 14px;border-radius:14px;background:#444}
.pick{display:flex;flex-direction:column;gap:16px;max-width:420px;margin:12vh auto}.pick button{padding:22px;font-size:22px}
.mini{color:#ff9494;font-size:15px;margin-top:14px}
@media(max-width:700px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body class="dark">
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== 설정 (여기만 바꾸면 됩니다) ===== */
const firebaseConfig={
  apiKey:"AIzaSyBbxbD8gVCL0GdvTJRUiIKgdEDcAq1W48I",
  authDomain:"escape-room-a9354.firebaseapp.com",
  databaseURL:"https://escape-room-a9354-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"escape-room-a9354",
  appId:"1:1051441202849:web:41f48b596de164d4dd92e0"
};
const ADMIN_PIN="2317";
const PRESETS=["힌트가 필요하면 화면 아래를 눌러 보세요.","남은 시간이 5분입니다.","남은 시간이 1분입니다. 서둘러 주세요.","시간이 종료되었습니다. 기기를 들고 나와 주세요."];
/* ===================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,G={status:'idle',totalMs:600000,hintIdx:-1},H=[],R=[],role=null,view='main',sel=-1,cd=0,cdT=null,built=false,edBuilt=false,ended=false,primed=false,lastN=null,off=0,pinOk=false,lastP='',spoke={},swapT=0,filled=false,sLoaded=false,bHead='',bRows='';
let S={mn:10,sc:0,pp:30,m1:'10초 후 게임이 시작됩니다. 준비해 주세요.',m2:'게임을 시작합니다. 행운을 빕니다.'};
const now=()=>Date.now()+off;
const phase=()=>G.status==='running'&&G.startAt&&now()<G.startAt?'prep':G.status;
const left=()=>{const s=G.status;if(s==='running')return phase()==='prep'?G.totalMs:Math.max(0,G.endsAt-now());if(s==='idle')return G.totalMs;return G.remainMs??0};
const shown=()=>phase()==='prep'?G.startAt-now():left();
const digs=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return String(Math.min(99,Math.floor(s/60))).padStart(2,'0')+String(s%60).padStart(2,'0')};
const tHTML=ms=>{const d=digs(ms);return `<span class="big"><i class="d">${d[0]}</i><i class="d">${d[1]}</i></span><span class="u">분</span><span class="big"><i class="d">${d[2]}</i><i class="d">${d[3]}</i></span><span class="u">초</span>`};
function upd(el,ms){const d=digs(ms),ds=el.querySelectorAll('.d');if(ds.length!==4){el.innerHTML=tHTML(ms);return}
  ds.forEach((x,i)=>{if(x.textContent!==d[i]){x.textContent=d[i];x.classList.remove('chg');void x.offsetWidth;x.classList.add('chg')}})}
const mmss=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초'};
const STAT={idle:'대기 중',prep:'준비 중',running:'진행 중',paused:'일시정지',finished:'종료'};
const set=p=>db.doc('game/state').set({...G,...p});
function speak(t){if(!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
/* 화면 전환: 이전 화면이 부드럽게 사라지고 새 화면이 올라옴 */
function show(a,key,html,bind){
  if(a.dataset.k===key)return;
  const first=!a.dataset.k;a.dataset.k=key;
  const apply=()=>{a.innerHTML=html;a.classList.remove('out');if(bind)bind()};
  clearTimeout(swapT);
  if(first){apply();return}
  a.classList.add('out');swapT=setTimeout(apply,170);
}
async function init(){
  const h=location.hash.slice(1);
  if(['player','admin','board'].includes(h))role=h;else{try{role=localStorage.getItem('er-role')}catch(e){}}
  document.addEventListener('pointerdown',()=>{if(!primed){primed=true;try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}if(role==='player')render()}});
  try{if(firebaseConfig.databaseURL){firebase.initializeApp(firebaseConfig);const f=firebase.database();f.ref('.info/serverTimeOffset').on('value',x=>{off=x.val()||0});
    const doc=p=>({set:d=>f.ref(p).set(d),delete:()=>f.ref(p).remove(),onSnapshot:(n,e)=>f.ref(p).on('value',x=>n({exists:x.exists(),data:()=>x.val()}),e)});
    const col=p=>({add:d=>f.ref(p).push(d),onSnapshot:(n,e)=>f.ref(p).on('value',x=>{const docs=[];x.forEach(ch=>{docs.push({id:ch.key,data:()=>ch.val()})});n({docs})},e)});
    db={doc,collection:col}}}catch(e){db=null}
  render();if(!db)return;
  db.doc('game/state').onSnapshot(s=>{if(s.exists){G={...G,...s.data()}}render()},()=>{});
  db.doc('settings').onSnapshot(s=>{if(s.exists)S={...S,...s.data()};sLoaded=true;fillAdmin()},()=>{});
  db.doc('announce').onSnapshot(s=>{if(!s.exists){if(lastN===null)lastN=0;return}const d=s.data();if(lastN===null){lastN=d.n;return}if(d.n!==lastN){lastN=d.n;if(role==='player')speak(d.text)}},()=>{});
  db.collection('hints').onSnapshot(q=>{H=[];q.docs.forEach(d=>{H[+d.id.slice(1)]=d.data()});if(role==='admin'&&built&&!edBuilt)buildEd();render()},()=>{});
  db.collection('records').onSnapshot(q=>{R=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.clear?1:0)-(a.clear?1:0)||(a.clear?a.clearMs-b.clearMs:a.ts-b.ts)).slice(0,20);render()},()=>{});
  setInterval(tick,250);
}
function tick(){
  const p=phase();if(p!==lastP){lastP=p;render()}
  const ms=shown(),warn=p==='running'&&ms<=60000,pu=p==='running'&&ms<=10000;
  document.querySelectorAll('[data-timer]').forEach(e=>{upd(e,ms);e.classList.toggle('warn',warn);e.classList.toggle('pulse',pu)});
  if(p==='running'&&ms<=0&&!ended&&role!=='board'&&db){ended=true;set({status:'finished',remainMs:0,result:'timeout',registered:false})}
  if(G.status!=='running')ended=false;
  if(role==='player'&&G.status==='running'&&G.startAt){const r=G.startAt-now();
    if(r>0&&r<=10000&&spoke.a!==G.startAt){spoke.a=G.startAt;speak(G.msgPre)}
    if(r<=0&&r>-3000&&spoke.b!==G.startAt){spoke.b=G.startAt;speak(G.msgStart)}}
}
function render(){
  const a=$('#app');
  if(!db){document.body.className='dark';a.innerHTML='<div class="wrap"><h2>설정이 비어 있거나 연결할 수 없습니다</h2></div>';return}
  if(!role){document.body.className='dark';built=false;show(a,'pick','<div class="pick"><h2>이 기기의 역할을 선택하세요</h2><button data-r="player">타이머 기기 (체험자)</button><button data-r="board">리더보드 (큰 화면)</button><button data-r="admin">관리도구</button></div>',()=>
    a.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{role=b.dataset.r;a.dataset.k='';try{localStorage.setItem('er-role',role)}catch(e){}render()}));return}
  if(role==='player')return player(a);
  if(role==='board')return board(a);
  document.body.className='dark';
  if(ADMIN_PIN&&!pinOk){built=false;show(a,'pin','<div class="pick"><h2>관리도구 비밀번호</h2><input id="pin" type="password" inputmode="numeric"><button id="pok">확인</button></div>',()=>{$('#pok').onclick=()=>{if($('#pin').value===ADMIN_PIN){pinOk=true;a.dataset.k='';render()}else $('#pin').value=''}});return}
  admin(a);
}
/* ---------- 타이머 기기 ---------- */
const hs=()=>{const x=H[G.hintIdx]||{};return (x.title||'')+(x.text||'')+(x.img||'').length};
function player(a){
  const p=phase(),used=G.hintIdx>=0,can=p==='running';
  if(p==='finished')return endScreen(a);
  document.body.className='dark';
  const k=[view,p,G.hintIdx,sel,primed,view==='card'?hs():''].join('|');
  if(a.dataset.k===k)return;
  let h;
  if(view==='main'){
    h=`<div class="full"><div class="c"><div class="lbl" style="font-size:22px">${p==='prep'?'게임 시작까지':'남은 시간'}</div><div class="huge" data-timer>${tHTML(shown())}</div>${primed?'':'<div class="mini">화면을 한 번 터치하면 음성 안내가 켜집니다</div>'}</div><div class="bar" id="open">힌트 카드를 표시하려면 여기를 누르세요.</div></div>`;
  }else{
    h=`<div class="wrap"><div class="top"><div><div class="lbl">${p==='prep'?'게임 시작까지':'남은 시간'}</div><div data-timer>${tHTML(shown())}</div></div><div class="note">시간 제한이 끝 날때까지 힌트는 단 한번만 사용할 수 있습니다.</div></div><div class="panel">`;
    if(view==='card'&&used){const x=H[G.hintIdx]||{};
      h+=`<div class="hv"><h2>${esc(x.title||'힌트 '+(G.hintIdx+1))}</h2><p>${esc(x.text||'')}</p>${x.img?`<img src="${x.img}" alt="">`:''}</div><div class="bar w" id="close">힌트 카드를 닫으려면 여기를 누르세요.</div>`;
    }else if(view==='confirm'){
      h+=`<div class="conf"><div class="card"><span>힌트${sel+1}</span></div><div class="t"><p><b>“힌트 ${sel+1}”</b> 카드를 정말 열어보시겠습니까?<br>힌트는 단 한번만 열어 볼 수 있습니다.</p><p class="lbl">선택한 힌트는 시간 제한이 끝나기 전까지 “힌트목록”에 표시됩니다.</p></div><div class="b"><button id="go" class="${cd>0?'pink':''}" ${cd>0?'disabled':''}>${cd>0?cd+'초 후 선택 가능':'힌트카드 보기'}</button><button id="back">힌트 목록 화면으로</button></div></div>`;
    }else{
      h+='<div class="cards">';
      for(let i=0;i<5;i++){const m=used&&G.hintIdx===i,lock=(used&&!m)||(!can&&!m);h+=`<div class="card ${lock?'lock':''} ${m?'done':''}" data-i="${i}" style="--i:${i}"><span>힌트${i+1}${m?' ✓':''}</span></div>`}
      h+=`</div><div class="bar w" id="close0">힌트 카드를 닫으려면 여기를 누르세요.</div>`+(!can?'<p class="mini">지금은 힌트를 열 수 없습니다.</p>':'');
    }
    h+='</div></div>';
  }
  show(a,k,h,()=>{
    const o=$('#open');if(o)o.onclick=()=>{view='list';render()};
    const c0=$('#close0');if(c0)c0.onclick=()=>{view='main';render()};
    a.querySelectorAll('.card[data-i]').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;if(c.classList.contains('lock'))return;
      if(G.hintIdx===i){view='card';return render()}
      if(phase()!=='running'||G.hintIdx>=0)return;sel=i;view='confirm';cd=3;clearInterval(cdT);
      cdT=setInterval(()=>{cd--;if(cd<=0)clearInterval(cdT);const g=$('#go');if(g){g.disabled=cd>0;g.className=cd>0?'pink':'';g.textContent=cd>0?cd+'초 후 선택 가능':'힌트카드 보기'}},1000);render()});
    const g=$('#go');if(g)g.onclick=async()=>{if(cd>0)return;if(G.hintIdx<0&&phase()==='running'){G.hintIdx=sel;await set({hintIdx:sel})}view='card';render()};
    const b=$('#back');if(b)b.onclick=()=>{clearInterval(cdT);view='list';render()};
    const c=$('#close');if(c)c.onclick=()=>{view='list';render()};
  });

/* 시간이 끝났거나 탈출했을 때: 기록 입력 (타이머 기기) */
function endScreen(a){
  document.body.className='light';view='main';
  const clear=G.result==='clear';
  if(!G.registered){
    show(a,'form'+clear,`<div class="end"><div data-timer>${tHTML(shown())}</div><h1>${clear?'탈출 완료':'시간 종료'}</h1><p style="font-size:20px"><b>기기를 들고 부스 앞으로 나와 주세요.</b><br>리더보드에 등록하려면 대표자의 이름과 학번, 인원을 입력하십시오.<br>입력 시, 부스 앞 화면에 표시됩니다.</p>
    <input id="fn" placeholder="여기에 대표자 이름을 입력하세요."><input id="fs" inputmode="numeric" placeholder="여기에 학번을 입력하세요."><input id="fc" type="number" min="1" inputmode="numeric" placeholder="본인을 포함하여 몇명인지 입력하세요."><div id="er" class="mini"></div><button id="fok">완료</button></div>`,()=>{
      $('#fok').onclick=async()=>{const n=$('#fn').value.trim(),s=$('#fs').value.trim(),c=parseInt($('#fc').value);
        if(!n||!s||!(c>=1)){$('#er').textContent='이름, 학번, 인원을 모두 입력해 주세요.';return}
        $('#fok').disabled=true;await db.collection('records').add({name:n,sid:s,count:c,clear,clearMs:clear?G.totalMs-(G.remainMs||0):G.totalMs,ts:now()});await set({registered:true})}});
  }else show(a,'done'+clear,`<div class="end"><h1>등록되었습니다</h1><p style="font-size:24px"><b>기기를 들고 부스 앞으로 나와 주세요.</b></p></div>`);
}
/* ---------- 리더보드 ---------- */
function board(a){
  document.body.className='light';
  if(!$('#bh')){a.dataset.k='';a.innerHTML='<div class="wrap"><div class="bt" id="bh"></div><div class="grid" id="bg"></div></div>';bHead='';bRows=''}
  const p=phase(),bh=$('#bh');
  if(p!==bHead){bHead=p;
    bh.innerHTML=p==='prep'?'<span data-timer></span><span class="aft"> 후 시작해요.</span>':(p==='running'||p==='paused')?`<span data-timer></span><span class="aft"> ${p==='paused'?'일시정지':'남았어요.'}</span>`:`<span class="aft">${p==='finished'?'게임 종료':'다음 팀을 기다리고 있어요'}</span>`;
    bh.classList.remove('ent');void bh.offsetWidth;bh.classList.add('ent')}
  const top=R.slice(0,6),sig=top.map(r=>r.id+r.name+r.count+r.clearMs+r.clear).join();
  if(sig!==bRows){bRows=sig;const g=$('#bg'),old={};
    g.querySelectorAll('.rk[data-id]').forEach(e=>{old[e.dataset.id]=e.getBoundingClientRect()});
    let rows='';for(let i=0;i<6;i++){const r=top[i];rows+=r?`<div class="rk" data-id="${r.id}"><b>${i+1}등</b><i>${esc(r.name)}${r.count>1?' 외 '+(r.count-1)+'명':''}</i><em>${r.clear?mmss(r.clearMs):'시간 초과'}</em></div>`:`<div class="rk"><b>${i+1}등</b><i style="color:#aaa">—</i></div>`}
    g.innerHTML=rows;
    g.querySelectorAll('.rk[data-id]').forEach((e,i)=>{const o=old[e.dataset.id],r=e.getBoundingClientRect(),ez='cubic-bezier(.2,.8,.2,1)';
      if(o){const dx=o.left-r.left,dy=o.top-r.top;if(dx||dy)e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:650,easing:ez})}
      else e.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:650,easing:ez,delay:i*60,fill:'backwards'})})}
}
/* ---------- 관리도구 ---------- */
function arm(btn,fn){let t;btn.onclick=()=>{if(btn.dataset.arm){clearTimeout(t);btn.textContent=btn.dataset.o;delete btn.dataset.arm;fn()}else{btn.dataset.o=btn.textContent;btn.dataset.arm=1;btn.textContent='한 번 더 누르면 실행';t=setTimeout(()=>{btn.textContent=btn.dataset.o;delete btn.dataset.arm},3000)}}}
function say(t){if(t.trim())db.doc('announce').set({text:t.trim(),n:now()})}
function fillAdmin(){if(!built||filled||!sLoaded)return;filled=true;$('#mn').value=S.mn;$('#sc').value=S.sc;$('#pp').value=S.pp;$('#m1').value=S.m1;$('#m2').value=S.m2}
function saveS(){S={mn:Math.min(99,Math.max(0,+$('#mn').value||0)),sc:Math.min(59,Math.max(0,+$('#sc').value||0)),pp:Math.max(0,+$('#pp').value||0),m1:$('#m1').value,m2:$('#m2').value};db.doc('settings').set(S)}
function admin(a){
  if(!built){built=true;edBuilt=false;filled=false;a.dataset.k='admin';
    a.innerHTML=`<div class="wrap"><h1>관리도구</h1><div class="panel"><div>상태: <span class="badge" id="st"></span></div><div class="mid" data-timer style="margin:10px 0"></div><div id="hu" class="lbl"></div>
    <div class="row"><button id="bs">시작</button><button id="bp">일시정지</button><button id="bc">탈출 완료 처리</button><button id="br">초기화</button></div></div>
    <div class="panel"><h3>시간 설정 (시작 버튼을 누를 때 적용)</h3>
    <div class="row">제한 시간 <input id="mn" type="number" min="0" max="99" style="width:80px"> 분 <input id="sc" type="number" min="0" max="59" style="width:80px"> 초 &nbsp; 준비 시간 <input id="pp" type="number" min="0" style="width:90px"> 초</div>
    <p class="lbl" style="margin:14px 0 4px">준비 시간이 10초 남았을 때 읽을 멘트</p><div class="row"><input id="m1" style="flex:1;min-width:220px"><button id="t1">미리듣기</button></div>
    <p class="lbl" style="margin:14px 0 4px">준비 시간이 끝나 게임이 시작될 때 읽을 멘트</p><div class="row"><input id="m2" style="flex:1;min-width:220px"><button id="t2">미리듣기</button></div>
    <p class="lbl">멘트는 타이머 기기에서 기본 음성(TTS)으로 재생돼요. 타이머 기기를 한 번 터치해 두어야 소리가 납니다.</p></div>
    <div class="panel"><h3>음성 안내 (바로 재생)</h3><div id="pr" class="row"></div><div class="row"><input id="vt" placeholder="직접 입력한 문장 읽어주기" style="flex:1;min-width:220px"><button id="vb">읽기</button></div></div>
    <div class="panel"><h3>힌트 내용 설정</h3><div id="ed">불러오는 중…</div></div>
    <div class="panel"><h3>리더보드 기록</h3><div id="rl"></div></div></div>`;
    ['mn','sc','pp','m1','m2'].forEach(i=>$('#'+i).onchange=saveS);
    $('#t1').onclick=()=>speak($('#m1').value);$('#t2').onclick=()=>speak($('#m2').value);
    $('#bs').onclick=()=>{saveS();const tot=Math.max(10000,S.mn*60000+S.sc*1000),t=now();ended=false;spoke={};
      set({status:'running',totalMs:tot,startAt:t+S.pp*1000,endsAt:t+S.pp*1000+tot,remainMs:tot,hintIdx:-1,result:null,registered:false,msgPre:S.m1,msgStart:S.m2})};
    $('#bp').onclick=()=>{if(G.status==='running'&&phase()==='running')set({status:'paused',remainMs:left()});else if(G.status==='paused')set({status:'running',endsAt:now()+G.remainMs})};
    arm($('#bc'),()=>{if(phase()!=='running'&&G.status!=='paused')return;set({status:'finished',remainMs:left(),result:'clear',registered:false})});
    arm($('#br'),()=>set({status:'idle',hintIdx:-1,remainMs:0,result:null,registered:false}));
    PRESETS.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>say(t);$('#pr').append(b)});
    $('#vb').onclick=()=>say($('#vt').value);
    buildEd();fillAdmin();
  }
  const s=G.status,p=phase();
  $('#st').textContent=STAT[p];
  $('#bs').disabled=s==='running'||s==='paused';
  $('#bp').disabled=!(p==='running'||s==='paused');$('#bp').textContent=s==='paused'?'재개':'일시정지';
  $('#bc').disabled=!(p==='running'||s==='paused');
  $('#hu').textContent=(G.hintIdx>=0?`힌트 ${G.hintIdx+1}번 사용됨`:'힌트 아직 사용 안 함')+(s==='finished'?(G.result==='clear'?' · 탈출 완료':' · 시간 종료')+(G.registered?' · 기록 등록됨':' · 기록 입력 대기 중'):'');
  const rl=$('#rl');rl.innerHTML='';if(!R.length)rl.textContent='기록 없음';
  R.forEach((r,i)=>{const d=document.createElement('div');d.className='row';const sp=document.createElement('span');sp.style.flex='1';sp.textContent=`${i+1}. ${r.name} (${r.sid}) ${r.count}명 — ${r.clear?mmss(r.clearMs):'시간 초과'}`;const b=document.createElement('button');b.textContent='삭제';arm(b,()=>db.doc('records/'+r.id).delete());d.append(sp,b);rl.append(d)});
}
function buildEd(){
  const ed=$('#ed');if(!ed)return;edBuilt=true;ed.innerHTML='';
  for(let i=0;i<5;i++){
    const x=H[i]||{};let img=x.img||'';
    const d=document.createElement('div');d.className='hed';
    d.innerHTML='<b>힌트 '+(i+1)+'</b><input class="a" placeholder="힌트 제목"><textarea class="b" rows="3" placeholder="힌트 내용"></textarea><input class="c" type="file" accept="image/*"><img class="p" alt=""><div class="row"><button class="s">저장</button><button class="x">이미지 제거</button></div>';
    const A=d.querySelector('.a'),B=d.querySelector('.b'),P=d.querySelector('.p'),Sv=d.querySelector('.s');
    A.value=x.title||'';B.value=x.text||'';P.hidden=!img;if(img)P.src=img;
    d.querySelector('.c').onchange=e=>{const f=e.target.files[0];if(f)shrink(f,u=>{img=u;P.src=u;P.hidden=false})};
    d.querySelector('.x').onclick=()=>{img='';P.hidden=true};
    Sv.onclick=async()=>{try{await db.doc('hints/h'+i).set({title:A.value,text:B.value,img});Sv.textContent='저장됨 ✓'}catch(e){Sv.textContent='저장 실패'}setTimeout(()=>Sv.textContent='저장',2000)};
    ed.append(d);
  }
}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};im.src=r.result};r.readAsDataURL(f)}
init();
</script></body></html>
